<head>

  body { font-family: Segoe UI, system-ui, sans-serif; background:#0f1115; color:#e6e6e6; margin:0; display:flex; flex-direction:column; }
  nav { display:flex; gap:14px; align-items:center; padding:10px 16px; background:#141922; border-bottom:1px solid #2a3140; flex:0 0 auto; }

  iframe { flex:1; width:100%; border:0; background:#0f1115; }

<iframe id="frame" src="http://localhost:3777/" title="Jarvis"></iframe>
<div class="down" id="down" style="display:none">
  <p>Jarvis's UI isn't running right now.</p>
  <p>Start it with <code>npm run ui</code> in <code>C:\Users\shrey\Downloads\AI</code>.</p>
</div>
<script>
document.getElementById('frame').addEventListener('error', () => {
  document.getElementById('frame').style.display = 'none';
  document.getElementById('down').style.display = 'block';
});
